[audio]
sound_volume = 0.79999998211860657

[bar]
order = [ "default" ]

    [bar.default]
    background_opacity = 0.39999999105930328
    capsule = true
    capsule_border_width = 0.0
    center = [ "group:time" ]
    end = [ "group:tools", "group:audio", "group:connectivity", "group:notifications", "group:controls" ]
    font_family = "Inter"
    radius = 16
    reserve_space = false
    show_on_workspace_switch = false
    smart_auto_hide = true
    start = [ "group:navigation", "group:metrics" ]

        [[bar.default.capsule_group]]
        id = "navigation"
        members = [ "launcher", "workspaces", "wallpaper" ]
        enabled = true
        accordion = false
        accordion_direction = "end"

        [[bar.default.capsule_group]]
        id = "metrics"
        members = [ "ram", "temp", "cat" ]
        enabled = true
        accordion = false
        accordion_direction = "end"

        [[bar.default.capsule_group]]
        id = "time"
        members = [ "weather", "clock" ]
        enabled = true
        accordion = false
        accordion_direction = "end"

        [[bar.default.capsule_group]]
        id = "tools"
        members = [ "widget", "caffeine", "widget_2" ]
        enabled = true
        accordion = false
        accordion_direction = "end"

        [[bar.default.capsule_group]]
        id = "audio"
        members = [ "volume", "media", "audio_visualizer" ]
        enabled = true
        accordion = false
        accordion_direction = "end"

        [[bar.default.capsule_group]]
        id = "connectivity"
        members = [ "network", "bluetooth", "battery" ]
        enabled = true
        accordion = false
        accordion_direction = "end"

        [[bar.default.capsule_group]]
        id = "notifications"
        members = [ "tray", "notifications" ]
        enabled = true
        accordion = false
        accordion_direction = "end"

        [[bar.default.capsule_group]]
        id = "controls"
        members = [ "privacy", "control-center", "session" ]
        enabled = true
        accordion = false
        accordion_direction = "end"

# Blurred and tinted copy of the current wallpaper for Niri Overview.
[backdrop]
enabled = true
blur_intensity = 0.5
tint_intensity = 0.3

[bluetooth]
connect_when_enabled = true
connection_notifications = true

[calendar]
enabled = true

[weather]
enabled = true

[control_center.media]
show_visualizer = false

[dock]
reserve_space = false
show_dots = true
smart_auto_hide = true

[idle]
behavior_order = [ "lock", "screen-off" ]
pre_action_fade_seconds = 0

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 300.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    locked_timeout = 60.0
    timeout = 360.0

[location]
auto_locate = true # Resolve an approximate location from the current public IP.

[lockscreen]
blur_intensity = 0.34999999217689037
enabled = true
fingerprint = false
grace_period_seconds = 0
lock_before_suspend = true
tint_intensity = 0.34999999217689037

# Widget positions retain their 3440x1440 reference canvas; Noctalia rescales them for other outputs.
[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@primary", "lockscreen-widget-0000000000000001", "lockscreen-widget-0000000000000003" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@primary"]
    box_height = 196.0
    box_width = 810.0
    cx = 1720.0
    cy = 1198.0
    placement_height = 1440.0
    placement_width = 3440.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@primary".settings]
        background_color = "surface_container"
        background_opacity = 0.0
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 0.0
    box_width = 0.0
    cx = 1720.0
    cy = 224.5
    placement_height = 1440.0
    placement_width = 3440.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background_color = "hover"
        background_opacity = 0.0
        background_radius = 12
        clock_style = "digital"
        color = "primary"

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000003]
    box_height = 0.0
    box_width = 0.0
    cx = 1720.0
    cy = 720.0
    placement_height = 1440.0
    placement_width = 3440.0
    rotation = 0.0
    type = "fancy_audio_visualizer"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000003.settings]
        background = false
        visualization_mode = "bars_rings"

[notification]
background_opacity = 0.79999998211860657
history_retention_hours = 12
max_visible = 3

[plugins]
enabled = [
    "noctalia/wallhaven",
    "oldirtty/color_picker",
    "noctalia/timer",
    "noctalia/translator",
    "thepunkoff/pomodoro",
    "dotnetrob/cat"
]

[shell]
clipboard_enabled = true
corner_radius_scale = 2.0
font_family = "Inter"
launch_apps_as_systemd_services = true
password_style = "random"
polkit_agent = true
screen_time_enabled = true
settings_show_advanced = true
show_location = false
telemetry_enabled = true

    [shell.panel]
    border_width = 0.0
    transparency_mode = "glass"
    wallpaper_show_names = false

    [shell.window_switcher]
    mru = true
    show_caption = false
    show_count = false
    style = "icons"

[system.monitor]
cpu_freq_critical_threshold = 5.3000000000000007
cpu_temp_critical_threshold = 95
cpu_usage_critical_threshold = 100
gpu_temp_critical_threshold = 95
gpu_usage_critical_threshold = 100
ram_pct_critical_threshold = 95

[theme]
builtin = "Catppuccin"
community_palette = "Catppuccin Frappe Peach"
mode = "dark"
source = "community"
wallpaper_scheme = "m3-content"

[wallpaper]
transition_on_startup = true

    [wallpaper.automation]
    enabled = true

    [wallpaper.default]
    path = "wallhaven-73looo.jpg"

    [wallpaper.last]
    path = "wallhaven-73looo.jpg"

    [[wallpaper.favorite]]
    community_palette = "Catppuccin Frappe Sapphire"
    palette_source = "community"
    path = "wallhaven-yxyye7.png"
    theme_mode = "dark"

    [[wallpaper.favorite]]
    path = "wallhaven-p8gvvp.jpg"

    [[wallpaper.favorite]]
    path = "wallhaven-mdyvvm.jpg"

    [[wallpaper.favorite]]
    path = "wallhaven-28zo8x.png"

    [[wallpaper.favorite]]
    path = "wallhaven-73looo.jpg"

    [[wallpaper.favorite]]
    community_palette = "ADW"
    palette_source = "community"
    path = "wallhaven-d6eylg.jpg"
    theme_mode = "dark"

[widget.active_window]
anchor = true
display = "icon_only"
max_length = 120
min_length = 0

[widget.audio_visualizer]
bands = 32
interactive = false
mirrored = false
show_when_idle = true
width = 128

[widget.ram]
type = "sysmon"
stat = "ram_pct"
visualization = "none"
highlight_color = "#E5C890"

[widget.temp]
type = "sysmon"
stat = "cpu_temp"
visualization = "none"
highlight_color = "#EF9F76"

[widget.clock]
format = "{:%H:%M}\n{:%a, %d %b}"
tooltip_format = "{:%A, %B %d, %Y}"

[widget.cat]
cat_color_mode = "custom"
cat_size = 48
show_cpu_percent = true
type = "dotnetrob/cat:cat"

[widget.widget]
type = "thepunkoff/pomodoro:widget"

[widget.widget_2]
type = "oldirtty/color_picker:widget"