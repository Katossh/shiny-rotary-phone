name: NixOS configuration

on:
  pull_request:
    paths:
      - "**/*.nix"
      - "**/*.sh"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/nixos.yml"
      - ".github/workflows/update-flake-lock.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.nix"
      - "**/*.sh"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/nixos.yml"
      - ".github/workflows/update-flake-lock.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nixos-config-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Nix configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Prepare local hardware configuration fixture
        run: |
          cat > hosts/workstation/hardware-configuration.nix <<'NIX'
          { modulesPath, ... }:
          {
            imports = [ (modulesPath + "/installer/scan/not-detected.nix") ];
            boot.initrd.availableKernelModules = [ "nvme" "xhci_pci" ];
            fileSystems."/" = {
              device = "/dev/disk/by-label/nixos";
              fsType = "ext4";
            };
            fileSystems."/boot" = {
              device = "/dev/disk/by-label/ESP";
              fsType = "vfat";
            };
          }
          NIX

      - name: Check shell syntax
        run: |
          bash -n install.sh
          bash -n scripts/nixcfg.sh

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            extra-substituters = https://noctalia.cachix.org
            extra-trusted-public-keys = noctalia.cachix.org-1:pCOR47nnMEo5thcxNDtzWpOxNFQsBRglJzxWPp3dkU4=

      - name: Check formatting
        run: |
          mapfile -t nix_files < <(git ls-files '*.nix')
          nix fmt -- "${nix_files[@]}"
          git diff --exit-code -- "${nix_files[@]}"

      - name: Run Nix static analysis
        run: |
          nix develop "path:$GITHUB_WORKSPACE#default" --no-update-lock-file --command bash -euo pipefail -c '
            mapfile -t nix_files < <(git ls-files "*.nix")
            for nix_file in "${nix_files[@]}"; do
              statix check "$nix_file"
            done
            deadnix --fail "${nix_files[@]}"
          '

      - name: Evaluate flake outputs without building
        run: |
          nix flake check "path:$GITHUB_WORKSPACE" \
            --no-build \
            --no-update-lock-file \
            --accept-flake-config \
            --show-trace

  build:
    name: Build workstation system
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Prepare local hardware configuration fixture
        run: |
          cat > hosts/workstation/hardware-configuration.nix <<'NIX'
          { modulesPath, ... }:
          {
            imports = [ (modulesPath + "/installer/scan/not-detected.nix") ];
            boot.initrd.availableKernelModules = [ "nvme" "xhci_pci" ];
            fileSystems."/" = {
              device = "/dev/disk/by-label/nixos";
              fsType = "ext4";
            };
            fileSystems."/boot" = {
              device = "/dev/disk/by-label/ESP";
              fsType = "vfat";
            };
          }
          NIX

      # The full desktop closure exceeds the free space left by the stock
      # GitHub-hosted Ubuntu image. Remove runner-only SDKs and tools; this
      # does not change anything in the NixOS configuration being built.
      # Keep the tool cache and swap so subsequent JavaScript actions and the
      # build runtime retain their normal execution environment.
      - name: Free disk space for NixOS build
        uses: endersonmenezes/free-disk-space@8b8cd4e2277836962939a8f3b4ea0ee4bc006156 # v4
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle /opt/pipx /usr/share/swift /usr/share/miniconda /usr/local/julia*"

      - name: Report available build disk space
        run: df -h /

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            extra-substituters = https://noctalia.cachix.org
            extra-trusted-public-keys = noctalia.cachix.org-1:pCOR47nnMEo5thcxNDtzWpOxNFQsBRglJzxWPp3dkU4=

      # Cache names are public configuration. Only check for the write token
      # on trusted pushes to main; never expose it to pull-request workflows.
      - name: Check Cachix publishing credentials
        id: cachix_token
        if: ${{ vars.CACHIX_CACHE_NAME != '' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        shell: bash
        run: |
          if [[ -n "${CACHIX_AUTH_TOKEN:-}" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CACHIX_AUTH_TOKEN is not configured; Cachix will be used read-only."
          fi

      # Public cache reads are safe on pull requests and remain available on
      # main when the optional publishing token has not been configured.
      - name: Configure Cachix (read-only)
        if: ${{ vars.CACHIX_CACHE_NAME != '' && steps.cachix_token.outputs.available != 'true' }}
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          skipPush: true

      # Only trusted pushes to main with an explicitly configured token publish.
      - name: Configure Cachix (publish from main)
        if: ${{ vars.CACHIX_CACHE_NAME != '' && steps.cachix_token.outputs.available == 'true' }}
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Explain disabled Cachix cache
        if: ${{ vars.CACHIX_CACHE_NAME == '' }}
        run: |
          echo "::notice::Cachix is not configured. Create a public cache and set the CACHIX_CACHE_NAME repository variable to enable it."

      - name: Build the workstation system closure
        run: |
          nix build \
            --no-update-lock-file \
            --accept-flake-config \
            "path:$GITHUB_WORKSPACE#nixosConfigurations.workstation-ci.config.system.build.toplevel" \
            --no-link \
            --fallback \
            --print-build-logs
