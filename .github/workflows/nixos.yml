name: NixOS configuration

on:
  pull_request:
    paths:
      - "**/*.nix"
      - "**/*.sh"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/nixos.yml"
      - ".github/workflows/update-flake-lock.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.nix"
      - "**/*.sh"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/nixos.yml"
      - ".github/workflows/update-flake-lock.yml"
  workflow_dispatch:
    inputs:
      build_full_system:
        description: "Build the complete workstation closure, including the custom CachyOS kernel"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: nixos-config-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Nix configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Reject tracked machine-local hardware configuration
        run: |
          if git ls-files --error-unmatch hosts/workstation/hardware-configuration.nix >/dev/null 2>&1; then
            echo "hosts/workstation/hardware-configuration.nix is machine-local and must not be tracked." >&2
            exit 1
          fi

      - name: Prepare local hardware configuration fixture
        run: |
          cat > hosts/workstation/hardware-configuration.nix <<'NIX'
          { modulesPath, ... }:
          {
            imports = [ (modulesPath + "/installer/scan/not-detected.nix") ];
            boot.initrd.availableKernelModules = [ "nvme" "xhci_pci" ];
            fileSystems."/" = {
              device = "/dev/disk/by-label/nixos";
              fsType = "ext4";
            };
            fileSystems."/boot" = {
              device = "/dev/disk/by-label/ESP";
              fsType = "vfat";
            };
          }
          NIX

      - name: Check shell syntax
        run: |
          bash -n install.sh
          bash -n scripts/nixcfg.sh
          bash -n modules/security/bubblewrap/bwrap.sh

      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            extra-substituters = https://noctalia.cachix.org https://cache.lantian.pub/lantian
            extra-trusted-public-keys = noctalia.cachix.org-1:pCOR47nnMEo5thcxNDtzWpOxNFQsBRglJzxWPp3dkU4= lantian:WVGO7vsRMSEN+h7Lp7kv6SAmrkEXgUGbbXm7jMDjBuQ=

      - name: Check formatting
        run: |
          mapfile -t nix_files < <(git ls-files '*.nix')
          nix fmt -- "${nix_files[@]}"
          git diff --exit-code -- "${nix_files[@]}"

      - name: Evaluate flake outputs and workstation system
        run: |
          nix flake check \
            --no-build \
            --no-update-lock-file \
            --accept-flake-config \
            --show-trace \
            "path:$GITHUB_WORKSPACE"

          nix eval --raw \
            "path:$GITHUB_WORKSPACE#nixosConfigurations.workstation.config.system.build.toplevel.drvPath" \
            --no-update-lock-file \
            --accept-flake-config \
            --show-trace

      - name: Build pinned Xray core
        run: |
          xray_version="$(nix eval --raw \
            "path:$GITHUB_WORKSPACE#nixosConfigurations.workstation.pkgs.xray.version" \
            --no-update-lock-file \
            --accept-flake-config)"
          if [[ "$xray_version" != "26.11.9" ]]; then
            echo "Expected Xray 26.11.9, got $xray_version" >&2
            exit 1
          fi
          nix build \
            "path:$GITHUB_WORKSPACE#nixosConfigurations.workstation.pkgs.xray" \
            --no-link \
            --no-update-lock-file \
            --accept-flake-config

      - name: Verify Home Manager target enumeration
        run: |
          username="$(nix eval --raw "path:$GITHUB_WORKSPACE#nixosConfigurations.workstation.config.starforge.user.username" --no-update-lock-file --accept-flake-config)"
          managed_targets="$(nix eval --raw \
            "path:$GITHUB_WORKSPACE#nixosConfigurations.workstation.config.home-manager.users.\"$username\".home.file" \
            --apply '
              files:
              builtins.concatStringsSep "\n" (
                map (file: file.target)
                  (builtins.filter (file: file.enable) (builtins.attrValues files))
              )
            ' \
            --no-update-lock-file \
            --accept-flake-config)"
          grep -Fxq '.config/niri/config.kdl' <<< "$managed_targets"
          grep -Fxq '.cache/.keep' <<< "$managed_targets"
          if grep -q '^/' <<< "$managed_targets"; then
            echo "Home Manager emitted a target outside the home directory." >&2
            exit 1
          fi

      - name: Run Nix static analysis
        run: |
          nix develop "path:$GITHUB_WORKSPACE#default" --no-update-lock-file --command bash -euo pipefail -c '
            mapfile -t nix_files < <(git ls-files "*.nix")
            for nix_file in "${nix_files[@]}"; do
              statix check "$nix_file"
            done
            deadnix --fail "${nix_files[@]}"
          '

      - name: Ensure kernel Lockdown is not forced
        run: |
          kernel_params="$(nix eval --raw \
            "path:$GITHUB_WORKSPACE#nixosConfigurations.workstation.config.boot.kernelParams" \
            --apply 'params: builtins.concatStringsSep "\n" params' \
            --no-update-lock-file \
            --accept-flake-config)"
          if grep -Eq '^lockdown=' <<< "$kernel_params"; then
            echo "A lockdown= kernel parameter is still configured:" >&2
            grep -E '^lockdown=' <<< "$kernel_params" >&2
            exit 1
          fi

      - name: Verify AppArmor policy modes and credential exclusions
        run: |
          policy_states="$(nix eval --json \
            "path:$GITHUB_WORKSPACE#nixosConfigurations.workstation.config.security.apparmor.policies" \
            --apply 'policies: builtins.mapAttrs (_: policy: policy.state) policies' \
            --no-update-lock-file \
            --accept-flake-config)"
          python3 - "$policy_states" <<'PY'
          import json
          import sys

          states = json.loads(sys.argv[1])
          expected = {
              "curl": "enforce",
              "firefox": "complain",
              "chromium": "complain",
              "localsend": "complain",
              "telegram": "complain",
              "discord": "complain",
              "mpv": "complain",
              "yt-dlp": "complain",
              "ffmpeg": "complain",
              "jq": "complain",
              "btop": "complain",
              "fastfetch": "complain",
              "pavucontrol": "complain",
              "virt-manager": "complain",
              "vscode": "complain",
              "neovim": "complain",
              "zed": "complain",
          }
          for name, state in expected.items():
              actual = states.get(name)
              if actual != state:
                  raise SystemExit(
                      f"Unexpected AppArmor state for {name}: {actual!r}; expected {state!r}"
                  )
          print("AppArmor policy modes match the reviewed rollout matrix.")
          PY

          vscode_profile="$(nix eval --raw \
            "path:$GITHUB_WORKSPACE#nixosConfigurations.workstation.config.security.apparmor.policies.vscode.profile" \
            --no-update-lock-file \
            --accept-flake-config)"
          if ! grep -Eq '^profile /nix/store/[^[:space:]]+/bin/code[[:space:]]*[{]' <<< "$vscode_profile"; then
            echo "VS Code AppArmor profile must target the FHS /bin/code launcher." >&2
            exit 1
          fi

          ozone_wayland="$(nix eval --raw \
            "path:$GITHUB_WORKSPACE#nixosConfigurations.workstation.config.environment.sessionVariables.NIXOS_OZONE_WL" \
            --no-update-lock-file \
            --accept-flake-config)"
          if [[ "$ozone_wayland" != "1" ]]; then
            echo "NIXOS_OZONE_WL must be enabled for the Niri desktop session." >&2
            exit 1
          fi

          for policy in curl jq; do
            profile="$(nix eval --raw \
              "path:$GITHUB_WORKSPACE#nixosConfigurations.workstation.config.security.apparmor.policies.$policy.profile" \
              --no-update-lock-file \
              --accept-flake-config)"
            for protected_path in \
              '.ssh/**' \
              '.gnupg/**' \
              '.aws/**' \
              '.azure/**' \
              '.config/azure/**' \
              '.config/gh/**' \
              '.config/gcloud/**' \
              '.kube/**' \
              '.docker/config.json' \
              '.config/containers/auth.json' \
              '.config/rclone/rclone.conf' \
              '.git-credentials' \
              '.npmrc' \
              '.pypirc' \
              '.config/sops/age/keys.txt' \
              '.password-store/**'; do
              grep -Fq "deny owner @{HOME}/$protected_path rw," <<< "$profile" || {
                echo "AppArmor profile $policy is missing credential denial: $protected_path" >&2
                exit 1
              }
            done
            grep -Fq 'deny owner /run/user/[0-9]*/containers/auth.json rw,' <<< "$profile" || {
              echo "AppArmor profile $policy is missing the runtime Podman auth denial." >&2
              exit 1
            }
          done

      - name: Ensure CPU vulnerability mitigations are fully enabled
        run: |
          kernel_params="$(nix eval --raw \
            "path:$GITHUB_WORKSPACE#nixosConfigurations.workstation.config.boot.kernelParams" \
            --apply 'params: builtins.concatStringsSep "\n" params' \
            --no-update-lock-file \
            --accept-flake-config)"
          if ! grep -Fxq 'mitigations=auto,nosmt' <<< "$kernel_params"; then
            echo "Full CPU vulnerability mitigations are not configured:" >&2
            grep -E '^mitigations=' <<< "$kernel_params" >&2 || true
            exit 1
          fi

          split_lock_mitigate="$(nix eval --raw \
            "path:$GITHUB_WORKSPACE#nixosConfigurations.workstation.config.boot.kernel.sysctl.\"kernel.split_lock_mitigate\"" \
            --apply 'value: toString value' \
            --no-update-lock-file \
            --accept-flake-config)"
          if [[ "$split_lock_mitigate" != "1" ]]; then
            echo "kernel.split_lock_mitigate must remain enabled (expected 1)." >&2
            exit 1
          fi

      - name: Validate Btrfs and Snapper evaluation
        run: |
          cat > hosts/workstation/hardware-configuration.nix <<'NIX'
          { modulesPath, ... }:
          {
            imports = [ (modulesPath + "/installer/scan/not-detected.nix") ];
            boot.initrd.availableKernelModules = [ "nvme" "xhci_pci" ];
            fileSystems."/" = {
              device = "/dev/disk/by-label/nixos";
              fsType = "btrfs";
              options = [ "subvol=@" ];
            };
            fileSystems."/home" = {
              device = "/dev/disk/by-label/nixos";
              fsType = "btrfs";
              options = [ "subvol=@home" ];
            };
            fileSystems."/nix" = {
              device = "/dev/disk/by-label/nixos";
              fsType = "btrfs";
              options = [ "subvol=@nix" ];
            };
            fileSystems."/var/log" = {
              device = "/dev/disk/by-label/nixos";
              fsType = "btrfs";
              options = [ "subvol=@log" ];
            };
            fileSystems."/boot" = {
              device = "/dev/disk/by-label/ESP";
              fsType = "vfat";
            };
          }
          NIX
          configs="$(nix eval --raw \
            "path:$GITHUB_WORKSPACE#nixosConfigurations.workstation.config.services.snapper.configs" \
            --apply 'configs: builtins.concatStringsSep "," (builtins.attrNames configs)' \
            --no-update-lock-file \
            --accept-flake-config)"
          printf 'Snapper configs: %s\n' "$configs"
          grep -qE '(^|,)root(,|$)' <<< "$configs"
          grep -qE '(^|,)home(,|$)' <<< "$configs"
          nix eval --raw \
            "path:$GITHUB_WORKSPACE#nixosConfigurations.workstation.config.system.build.toplevel.drvPath" \
            --no-update-lock-file \
            --accept-flake-config >/dev/null

  # The regular PR/push checks intentionally stop at evaluation and static
  # validation. Building the complete closure can compile the custom kernel
  # and other large packages; run it manually only when explicitly requested.
  build:
    name: Build workstation system
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_full_system }}
    runs-on: ubuntu-24.04
    # Keep a long fallback timeout in case the pinned CachyOS kernel cache misses.
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Reject tracked machine-local hardware configuration
        run: |
          if git ls-files --error-unmatch hosts/workstation/hardware-configuration.nix >/dev/null 2>&1; then
            echo "hosts/workstation/hardware-configuration.nix is machine-local and must not be tracked." >&2
            exit 1
          fi

      - name: Prepare local hardware configuration fixture
        run: |
          cat > hosts/workstation/hardware-configuration.nix <<'NIX'
          { modulesPath, ... }:
          {
            imports = [ (modulesPath + "/installer/scan/not-detected.nix") ];
            boot.initrd.availableKernelModules = [ "nvme" "xhci_pci" ];
            fileSystems."/" = {
              device = "/dev/disk/by-label/nixos";
              fsType = "ext4";
            };
            fileSystems."/boot" = {
              device = "/dev/disk/by-label/ESP";
              fsType = "vfat";
            };
          }
          NIX

      # The full desktop closure exceeds the free space left by the stock
      # GitHub-hosted Ubuntu image. Remove runner-only SDKs and tools; this
      # does not change anything in the NixOS configuration being built.
      # Keep the tool cache and swap so subsequent JavaScript actions and the
      # build runtime retain their normal execution environment.
      - name: Free disk space for NixOS build
        uses: endersonmenezes/free-disk-space@8b8cd4e2277836962939a8f3b4ea0ee4bc006156 # v4
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle /opt/pipx /usr/share/swift /usr/share/miniconda /usr/local/julia*"

      - name: Report available build resources
        run: |
          df -h /
          free -h
          nproc

      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            extra-substituters = https://noctalia.cachix.org https://cache.lantian.pub/lantian
            extra-trusted-public-keys = noctalia.cachix.org-1:pCOR47nnMEo5thcxNDtzWpOxNFQsBRglJzxWPp3dkU4= lantian:WVGO7vsRMSEN+h7Lp7kv6SAmrkEXgUGbbXm7jMDjBuQ=

      # Cache names are public configuration. Only check for the write token
      # on trusted pushes to main; never expose it to pull-request workflows.
      - name: Check Cachix publishing credentials
        id: cachix_token
        if: ${{ vars.CACHIX_CACHE_NAME != '' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        shell: bash
        run: |
          if [[ -n "${CACHIX_AUTH_TOKEN:-}" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CACHIX_AUTH_TOKEN is not configured; Cachix will be used read-only."
          fi

      # Public cache reads are safe on pull requests and remain available on
      # main when the optional publishing token has not been configured.
      - name: Configure Cachix (read-only)
        if: ${{ vars.CACHIX_CACHE_NAME != '' && steps.cachix_token.outputs.available != 'true' }}
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          skipPush: true

      # Only trusted pushes to main with an explicitly configured token publish.
      - name: Configure Cachix (publish from main)
        if: ${{ vars.CACHIX_CACHE_NAME != '' && steps.cachix_token.outputs.available == 'true' }}
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Explain disabled Cachix cache
        if: ${{ vars.CACHIX_CACHE_NAME == '' }}
        run: |
          echo "::notice::Cachix is not configured. Create a public cache and set the CACHIX_CACHE_NAME repository variable to enable it."

      # Ubuntu runners already have a 3 GiB /swapfile. A cache miss for the
      # custom CachyOS kernel or another large source build may need more.
      # Use a separate temporary swap file for this explicitly requested build.
      - name: Add swap space for memory-intensive Nix builds
        run: |
          swapfile=/swapfile-nix-build
          if [[ ! -e "$swapfile" ]]; then
            sudo fallocate -l 16G "$swapfile"
            sudo chmod 600 "$swapfile"
            sudo mkswap "$swapfile"
          fi
          if ! swapon --show=NAME --noheadings | grep -Fxq "$swapfile"; then
            sudo swapon "$swapfile"
          fi
          free -h
          swapon --show
          swap_kib="$(awk 'NR > 1 { total += $3 } END { print total + 0 }' /proc/swaps)"
          if (( swap_kib < 16 * 1024 * 1024 )); then
            echo "Expected at least 16 GiB of active swap, found ${swap_kib} KiB." >&2
            exit 1
          fi

      - name: Build the workstation system closure
        run: |
          echo "Manual full-closure build requested; this may compile large packages."
          nix build \
            --max-jobs 1 \
            --cores 1 \
            --no-update-lock-file \
            --accept-flake-config \
            "path:$GITHUB_WORKSPACE#nixosConfigurations.workstation.config.system.build.toplevel" \
            --no-link \
            --fallback
