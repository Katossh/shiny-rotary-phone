name: NixOS configuration

on:
  pull_request:
    paths:
      - "**/*.nix"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/nixos.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.nix"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/nixos.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nixos-config-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Nix configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            extra-substituters = https://noctalia.cachix.org
            extra-trusted-public-keys = noctalia.cachix.org-1:pCOR47nnMEo5thcxNDtzWpOxNFQsBRglJzxWPp3dkU4=

      - name: Check formatting
        run: |
          nix fmt -- $(git ls-files '*.nix')
          git diff --exit-code -- '*.nix'

      - name: Evaluate flake outputs without building
        run: |
          nix flake check \
            --no-build \
            --no-update-lock-file \
            --accept-flake-config \
            --show-trace

  build:
    name: Build Starforge system
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The full desktop closure exceeds the free space left by the stock
      # GitHub-hosted Ubuntu image. Remove runner-only SDKs and tools; this
      # does not change anything in the NixOS configuration being built.
      # Keep the tool cache and swap so subsequent JavaScript actions and the
      # build runtime retain their normal execution environment.
      - name: Free disk space for NixOS build
        uses: endersonmenezes/free-disk-space@v4
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle /opt/pipx /usr/share/swift /usr/share/miniconda /usr/local/julia*"

      - name: Report available build disk space
        run: df -h /

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            extra-substituters = https://noctalia.cachix.org
            extra-trusted-public-keys = noctalia.cachix.org-1:pCOR47nnMEo5thcxNDtzWpOxNFQsBRglJzxWPp3dkU4=

      # Public cache reads are safe on pull requests. Never pass the write token
      # to pull-request workflows, including pull requests from this repository.
      - name: Configure Cachix (read-only)
        if: ${{ vars.CACHIX_CACHE_NAME != '' && !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        uses: cachix/cachix-action@v17
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          skipPush: true

      # Only trusted pushes to main receive the per-cache write token.
      - name: Configure Cachix (publish from main)
        if: ${{ vars.CACHIX_CACHE_NAME != '' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: cachix/cachix-action@v17
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Explain disabled Cachix cache
        if: ${{ vars.CACHIX_CACHE_NAME == '' }}
        run: |
          echo "::notice::Cachix is not configured. Create a public cache and set the CACHIX_CACHE_NAME repository variable to enable it."

      - name: Build the Starforge system closure
        run: |
          nix build \
            --no-update-lock-file \
            --accept-flake-config \
            .#nixosConfigurations.starforge.config.system.build.toplevel \
            --no-link \
            --print-build-logs
